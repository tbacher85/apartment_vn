{x:1.1,z:1,y:.3,lab:'Examine the drawing',mesh:drM,text:'A child’s drawing: four people in a room with a low table. One has been scratched out so hard the paper tore.',o:[{t:'Look closely at the scratched figure.',b:1,r:'The paper is warm, as if someone was just holding it.'},{t:'Fold it away without looking.',b:-1,r:'You feel watched while you do it.'}]},
{x:-2.1,z:3.8,y:1.1,lab:'Take the journal page',mesh:jM,text:'A torn journal page in cramped handwriting: “It isn’t angry. It only wants someone to stay.”',o:[{t:'Read it to the end.',b:1,r:'The last line is only the child’s name, over and over.'},{t:'Pocket it and read it later.',b:-1,r:'Your hand shakes as you put it away.'}]},
{x:-6.2,z:.3,y:1.1,lab:'Open the closet',text:'Inside, on the floor, a landlord’s letter: “I knew the family. I should have told you what the rent was really for.”',o:[{t:'Read it aloud.',b:1,r:'Your voice sounds loud in the empty room.'},{t:'Read it silently, ready to run.',b:-1,r:'Something shifts behind the other door.'}]}];
items.forEach(i=>i.glow=glow(i.x,i.y,i.z));
/* ---------- audio ---------- */
let AC,MG,muted=false,droneG,ringT;
function aInit(){if(AC)return;AC=new(window.AudioContext||webkitAudioContext)();MG=AC.createGain();MG.gain.value=.7;MG.connect(AC.destination);
const nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
const ns=AC.createBufferSource();ns.buffer=nb;ns.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=320;f.Q.value=.6;const g=AC.createGain();g.gain.value=.16;
const lf=AC.createOscillator();lf.frequency.value=.11;const lg=AC.createGain();lg.gain.value=200;lf.connect(lg);lg.connect(f.frequency);lf.start();ns.connect(f);f.connect(g);g.connect(MG);ns.start();
const c=AC.createOscillator();c.type='sawtooth';c.frequency.value=4300;const cf=AC.createBiquadFilter();cf.type='bandpass';cf.frequency.value=4300;cf.Q.value=8;const cg=AC.createGain();cg.gain.value=.01;const tr=AC.createOscillator();tr.frequency.value=26;const tg=AC.createGain();tg.gain.value=.01;tr.connect(tg);tg.connect(cg.gain);tr.start();c.connect(cf);cf.connect(cg);cg.connect(MG);c.start();
const dr=AC.createOscillator();dr.frequency.value=52;droneG=AC.createGain();droneG.gain.value=.03;dr.connect(droneG);droneG.connect(MG);dr.start()}
function tone(f,d,ty,v,w,sl){if(!AC)return;w=w||0;const t=AC.currentTime+w,o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(sl,t+d);g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d)}
const sfx={click:()=>tone(660,.07,'square',.04),pick:()=>{tone(523,.3,'sine',.15);tone(784,.4,'sine',.12,.1)},bell:()=>{tone(784,1.2,'sine',.2);tone(622,1.6,'sine',.2,.5)},step:()=>tone(80+Math.random()*25,.09,'triangle',.09),thud:()=>tone(90,.5,'sine',.3,0,30),
ring:()=>{clearInterval(ringT);const r=()=>[0,.14,.28,.42].forEach((w,i)=>tone(i%2?1300:1100,.12,'square',.06,w));r();ringT=setInterval(r,1200)}};
$('mute').onclick=()=>{muted=!muted;if(MG)MG.gain.value=muted?0:.7;$('mute').textContent=muted?'Sound off':'Sound on'};
/* ---------- state + story ---------- */
let state='menu',paused=false,ending=false,gt=0,si=0,courage=0,found=0,loops=0,yaw=0,pitch=0,flick=0,shake=0,lampT=1,cdT=.4,dawnT=0,bob=0,stepT=0,near=null,cur_=null;
const P=new THREE.Vector3(1.75,1.5,3.7),keys={},DUR=240,story=[];
const T=(t,f)=>story.push({t,f});
function vn(text,o){paused=true;document.exitPointerLock&&document.exitPointerLock();$('vn').style.display='flex';$('vt').textContent=text;const c=$('vc');c.innerHTML='';cur_=o;o.forEach((a,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'.  '+a.t;b.onclick=()=>pick(i);c.appendChild(b)});sfx.click()}
function pick(i){const a=cur_&&cur_[i];if(!a)return;cur_=null;courage+=a.b||0;$('vn').style.display='none';paused=false;sfx.click();a.f&&a.f();a.r&&toast(a.r)}
function toast(t){const e=$('tst');e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,4200)}
T(3,()=>vn('Apartment 405. The rent was strangely low. It is 11:47 PM, and you have until dawn.',[{t:'Step inside.'}]));
T(28,()=>{sfx.bell();figN=1;figK=1;drawDoor();shake=.2;vn('The doorbell rings. Through the frosted glass, someone stands very still.',[{t:'Open the door.',b:1,f:()=>{figK=.7;drawDoor()},r:'The figure steps back. It does not leave.'},{t:'Say nothing. Stay where you are.',b:-1,f:()=>{figK=1.25;drawDoor()},r:'The shape leans in. The glass hums.'}])});
T(80,()=>{sfx.ring();vn('The landline on the shelf is ringing. No one has this number.',[{t:'Pick up.',b:1,f:()=>clearInterval(ringT),r:'A whisper: “Don’t look at the shoji at three.” Click.'},{t:'Let it ring.',b:-1,f:()=>clearInterval(ringT),r:'It rings eleven times, then stops mid-ring.'}])});
T(130,()=>{flick=2.2;cdT=.7;shake=.3;sfx.thud();setTimeout(()=>{if(state==='play')vn('The lights stutter. In the back room, the closet door has slid open a hand’s width.',[{t:'Go and look.',b:1,r:'Something inside is breathing, slowly.'},{t:'Keep your back to it.',b:-1,f:()=>cdT=.9,r:'You hear the door slide wider.'}])},1500)});
T(180,()=>{lampT=0;sfx.thud();vn('The shrine lamp goes dark. The room smells of incense no one lit.',[{t:'Whisper: “I’m sorry for the noise.”',b:1,f:()=>lampT=.5,r:'The lamp returns, small and amber.'},{t:'Cover your ears.',b:-1,r:'The dark stays. The smell gets stronger.'}])});
T(DUR,()=>{figN=2;figK=1;drawDoor();sfx.bell();shake=.4;vn('3:00 AM. Two silhouettes at the frosted door now, one tall, one small. Dawn is somewhere behind them.',[{t:'Walk out through the door.',f:()=>decide(1)},{t:'Stay and face them.',f:()=>decide(0)}])});
function decide(leave){const tr=found===3,br=courage>=1;ending=true;dawnT=leave&&!tr||(!leave&&!tr)?0:1;
setTimeout(()=>{if(leave&&tr)fin('Quiet ending','The door opens onto grey dawn. You walk out knowing everything, and leave the child behind. Some places keep their tenants.');
else if(leave){loops++;fin('Loop ending','The door will not open. The clock jumps back to 11:47 PM. You are the new tenant again.',1)}
else if(tr&&br)fin('True ending','You say what the pages told you. The small silhouette lowers its hand, and the room turns the colour of morning.');
else if(tr)fin('Bitter ending','You understand, but your voice shakes. The child hears the fear, and dawn never reaches apartment 405.');
else fin('Bad ending','You face two shapes you cannot name. They were waiting for someone who doesn’t know the story.')},2800)}
function fin(t,x,loop){state='over';document.exitPointerLock&&document.exitPointerLock();$('et').textContent=t;$('ex').textContent=x;$('again').textContent=loop?'Begin the night again':'Play again';$('end').className='ov'}
function reset(){gt=0;si=0;courage=0;found=0;yaw=0;pitch=0;flick=0;lampT=1;cdT=.4;dawnT=0;ending=false;paused=false;figN=0;figK=1;drawDoor();P.set(1.75,1.5,3.7);clearInterval(ringT);items.forEach(i=>{i.done=0;i.glow.visible=true;i.mesh&&(i.mesh.visible=true)});$('vn').style.display='none';hud();state='play'}
function got(i){i.done=1;found++;i.mesh&&(i.mesh.visible=false);i.glow.visible=false;sfx.pick();shake=.12;hud();
if(found===3)setTimeout(()=>{if(state==='play')vn('The pieces fit. A family died in 405. The child never left. You aren’t the first new tenant, and the night isn’t over.',[{t:'Continue.'}])},700)}
function hud(){$('obj').textContent='Found '+found+' of 3'+(loops?'   Night '+(loops+1):'')}
/* ---------- input ---------- */
let drag=false;
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(k.startsWith('arrow')||k===' ')e.preventDefault();
if(state!=='play')return;if(paused){if(k>='1'&&k<='3')pick(+k-1);return}if(k==='e'&&near&&!ending)act(near)});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
addEventListener('mousedown',()=>drag=true);addEventListener('mouseup',()=>drag=false);
addEventListener('mousemove',e=>{if(state!=='play'||paused||ending)return;if(document.pointerLockElement||drag){yaw-=e.movementX*.0022;pitch=Math.max(-1.2,Math.min(1.2,pitch-e.movementY*.0022))}});
R.domElement.addEventListener('click',()=>{if(state==='play'&&!paused&&R.domElement.requestPointerLock)try{R.domElement.requestPointerLock()}catch(e){}});
function act(i){vn(i.text,i.o.map(o=>({t:o.t,b:o.b,r:o.r,f:()=>got(i)})))}
function start(){aInit();if(AC.state==='suspended')AC.resume();$('start').className='ov h';$('end').className='ov h';if(ending===false&&loops&&state==='over'){}reset();toast('Look around. Warm lights mark the way.')}
$('play').onclick=start;$('again').onclick=start;
/* ---------- loop ---------- */
const RC=[[-3,3,-2.5,2.5],[-7,-3,-2.5,2.5],[-2.4,.1,2.5,4.5],[.2,3,2.5,4.5]];
const inR=(x,z)=>RC.some(r=>x>=r[0]&&x<=r[1]&&z>=r[2]&&z<=r[3]);
const ok=(x,z)=>{const r=.28;if(Math.abs(x+3)<r&&Math.abs(z)>1.2)return false;return inR(x-r,z-r)&&inR(x+r,z-r)&&inR(x-r,z+r)&&inR(x+r,z+r)};
function update(dt){gt+=dt;
if(!ending){const f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),s=(keys.d?1:0)-(keys.a?1:0);yaw+=((keys.arrowleft?1:0)-(keys.arrowright?1:0))*1.8*dt;
let vx=-Math.sin(yaw)*f+Math.cos(yaw)*s,vz=-Math.cos(yaw)*f-Math.sin(yaw)*s;const l=Math.hypot(vx,vz);
if(l>0){vx*=2.4*dt/Math.max(l,1);vz*=2.4*dt/Math.max(l,1);if(ok(P.x+vx,P.z))P.x+=vx;if(ok(P.x,P.z+vz))P.z+=vz;bob+=dt*9;stepT-=dt;if(stepT<=0){sfx.step();stepT=.5}}}
if(si<story.length&&gt>=story[si].t&&!paused&&!ending)story[si++].f();
near=null;if(!ending)for(const i of items)if(!i.done&&Math.hypot(P.x-i.x,P.z-i.z)<1.6){near=i;break}
$('pr').textContent=near&&!paused?'E  '+near.lab:'';
const m=1427+Math.min(gt/DUR,1)*193+(dawnT?60:0),hh=Math.floor(m/60)%24,mm=Math.floor(m%60);$('clk').textContent=((hh%12)||12)+':'+String(mm).padStart(2,'0')+(hh<12?' AM':' PM');
if(flick>0){flick-=dt;ceil.intensity=Math.random()<.5?.05:1;ceil2.intensity=ceil.intensity*.7}else{ceil.intensity=1;ceil2.intensity=.7}
if(droneG)droneG.gain.value=.025+.05*(si/story.length)}
function frame(ts){requestAnimationFrame(frame);const dt=Math.min((ts-(frame.l||ts))/1000,.05);frame.l=ts;
if(state==='play'&&!paused)update(dt);
U.t.value+=dt;U.dawn.value+=(dawnT-U.dawn.value)*Math.min(dt*.8,1);U.dim.value+=((paused?1:0)-U.dim.value)*Math.min(dt*6,1);
lamp.intensity+=((lampT*1.2)-lamp.intensity)*Math.min(dt*3,1);lampM.visible=lampT>.1;
cd.position.z+=((.4+(cdT-.4)*1.0)-cd.position.z)*Math.min(dt*2,1);
shake*=Math.pow(.02,dt);const sk=shake*.05;
cam.position.set(P.x+(Math.random()-.5)*sk,P.y+Math.sin(bob)*.02+(Math.random()-.5)*sk,P.z);cam.rotation.set(pitch,yaw,0);sky.position.copy(cam.position);
const pu=.6+.4*Math.sin(U.t.value*3);items.forEach(i=>{i.glow.material.opacity=pu});dust.position.y=Math.sin(U.t.value*.3)*.05;dust.rotation.y+=dt*.01;
R.setRenderTarget(RT);R.render(sc,cam);R.setRenderTarget(null);post.uniforms.t.value=RT.texture;R.render(qs,qc)}
requestAnimationFrame(frame);
</script></body></html>
